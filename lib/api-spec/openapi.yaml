openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: ProofFlow API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User profile
  - name: projects
    description: Project management
  - name: milestones
    description: Milestone management
  - name: proofs
    description: Proof submission and review
  - name: transactions
    description: Payment transaction records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, completed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /projects/{projectId}/milestones:
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Add a milestone to a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestoneRequest"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /projects/{projectId}/milestones/{milestoneId}/proof:
    post:
      operationId: submitProof
      tags: [proofs]
      summary: Submit proof for a milestone (worker only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/milestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProofRequest"
      responses:
        "200":
          description: Proof submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /projects/{projectId}/milestones/{milestoneId}/approve:
    post:
      operationId: approveMilestone
      tags: [proofs]
      summary: Approve a milestone (client only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/milestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMilestoneRequest"
      responses:
        "200":
          description: Milestone approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /projects/{projectId}/milestones/{milestoneId}/reject:
    post:
      operationId: rejectMilestone
      tags: [proofs]
      summary: Reject / request changes (client only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/milestoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectMilestoneRequest"
      responses:
        "200":
          description: Milestone rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    milestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required: [field, message]
      required:
        - error
        - message

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          enum: [client, worker]
      required: [name, email, password, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [accessToken, user]

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
      required: [accessToken]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [client, worker]
        proofScore:
          type: integer
        walletAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, proofScore, createdAt]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        walletAddress:
          type: string
          nullable: true

    CreateProjectRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        workerId:
          type: string
        category:
          type: string
          maxLength: 100
        currency:
          type: string
          enum: [INR, USD, EUR, GBP, XLM, USDC]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/CreateMilestoneRequest"
          minItems: 1
      required: [title, workerId, currency, startDate, endDate, milestones]

    CreateMilestoneRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        amount:
          type: number
          exclusiveMinimum: 0
        dueDate:
          type: string
          format: date
      required: [title, amount, dueDate]

    SubmitProofRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          minLength: 10
          maxLength: 2000
        githubUrl:
          type: string
          format: uri
          nullable: true
        liveUrl:
          type: string
          format: uri
          nullable: true
        additionalUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
        contentHash:
          type: string
          nullable: true
          description: SHA-256 hash of proof content for on-chain verification
      required: [title, description]

    ApproveMilestoneRequest:
      type: object
      properties:
        txHash:
          type: string
          description: On-chain transaction hash from wallet
        notes:
          type: string
          maxLength: 500
          nullable: true
      required: [txHash]

    RejectMilestoneRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required: [reason]

    MilestoneResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        status:
          type: string
        proofStatus:
          type: string
        paymentStatus:
          type: string
        contractStatus:
          type: string
          nullable: true
        contractMilestoneIndex:
          type: integer
          nullable: true
        proof:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProofResponse"
        createdAt:
          type: string
          format: date-time
      required: [id, title, amount, dueDate, status, proofStatus, paymentStatus, createdAt]

    ProofResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        githubUrl:
          type: string
          nullable: true
        liveUrl:
          type: string
          nullable: true
        additionalUrl:
          type: string
          nullable: true
        contentHash:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
      required: [id, title, description, status, submittedAt]

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        clientId:
          type: string
        workerId:
          type: string
        category:
          type: string
        budget:
          type: number
        currency:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
        contractStatus:
          type: string
          nullable: true
        contractProjectId:
          type: string
          nullable: true
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, clientId, workerId, currency, startDate, endDate, status, milestones, createdAt, updatedAt]

    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [projects, total, page, limit]

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        milestoneId:
          type: string
        amount:
          type: number
        status:
          type: string
        type:
          type: string
        txHash:
          type: string
          nullable: true
        isDemo:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, milestoneId, amount, status, type, isDemo, createdAt]

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [transactions, total, page, limit]
